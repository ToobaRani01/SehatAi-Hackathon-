<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Enrol New Patient - SehatAi</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#2563eb', secondary: '#475569',
                        success: '#22c55e', warning: '#f59e0b',
                        danger: '#ef4444', background: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .sidebar-item-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        .form-input-focus { transition: all 0.2s; }
        .form-input-focus:focus { box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .toast {
            position: fixed; top: 24px; right: 24px;
            padding: 16px 24px; border-radius: 16px;
            font-weight: 600; font-size: 14px;
            z-index: 100; transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .toast.show { transform: translateX(0); }
        .toast-success { background: #22c55e; color: white; }
        .toast-error { background: #ef4444; color: white; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-20">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                <span class="material-symbols-outlined text-xl active-icon">medical_services</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-800">SehatAi</h1>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">grid_view</span> Dashboard
            </a>
            <a href="patients.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-lg sidebar-item-active">
                <span class="material-symbols-outlined active-icon">group</span> Patients
            </a>
            <a href="diagnostics.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">stethoscope</span> Diagnostics
            </a>
            <a href="history.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">history</span> History
            </a>
            <a href="medical_reports.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">description</span> AI Reports
            </a>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-colors">
                <span class="material-symbols-outlined">person</span> Profile
            </a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <a href="#" onclick="doLogout()" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 hover:text-red-600 transition-colors">
                <span class="material-symbols-outlined">logout</span> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
        <header class="mb-8">
            <div class="flex items-center gap-2 text-sm text-slate-400 font-semibold mb-2">
                <a href="patients.html" class="hover:text-blue-600 transition-colors">Registration</a>
                <span class="material-symbols-outlined text-base">chevron_right</span>
                <span class="text-slate-600">Add New Patient</span>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Add New Patient</h2>
        </header>

        <div class="max-w-2xl animate-slide-up">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                <form id="patient-form" class="space-y-6">
                    <!-- Patient ID (Auto-generated) -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Patient ID (Auto-generated)</label>
                        <input id="patient-id" type="text" readonly
                               class="w-full bg-slate-100 border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-500 cursor-not-allowed"
                               value="Loading...">
                    </div>

                    <!-- Full Name -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Full Name <span class="text-red-400">*</span></label>
                        <input id="full-name" type="text" required placeholder="e.g., John Doe"
                               class="w-full bg-white border-slate-200 rounded-xl px-4 py-3 text-sm font-medium form-input-focus focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>

                    <!-- Age & Gender Row -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Age <span class="text-red-400">*</span></label>
                            <input id="patient-age" type="number" required placeholder="30" min="0" max="150"
                                   class="w-full bg-white border-slate-200 rounded-xl px-4 py-3 text-sm font-medium form-input-focus focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Gender <span class="text-red-400">*</span></label>
                            <select id="patient-gender" required
                                    class="w-full bg-white border-slate-200 rounded-xl px-4 py-3 text-sm font-medium form-input-focus focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Contact Info -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Contact Information</label>
                        <input id="patient-contact" type="text" placeholder="Email or Phone Number"
                               class="w-full bg-white border-slate-200 rounded-xl px-4 py-3 text-sm font-medium form-input-focus focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>

                    <!-- Medical History -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Medical History Summary</label>
                        <textarea id="medical-history" rows="4" placeholder="Brief overview of allergies, chronic conditions, or past procedures..."
                                  class="w-full bg-white border-slate-200 rounded-xl px-4 py-3 text-sm font-medium form-input-focus focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button id="submit-btn" type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 active:scale-[0.98] transition-all flex items-center justify-center gap-3 text-lg">
                        <span class="material-symbols-outlined">person_add</span>
                        <span>Register Patient</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Load next patient ID on page load
        async function loadNextPatientId() {
            try {
                const res = await fetch('/api/patients/next-id');
                const data = await res.json();
                document.getElementById('patient-id').value = data.patient_id;
            } catch (err) {
                document.getElementById('patient-id').value = 'P-XXXXX';
            }
        }
        loadNextPatientId();

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        // Handle form submission
        document.getElementById('patient-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> <span>Registering...</span>';

            const payload = {
                full_name: document.getElementById('full-name').value.trim(),
                age: parseInt(document.getElementById('patient-age').value),
                gender: document.getElementById('patient-gender').value,
                contact: document.getElementById('patient-contact').value.trim(),
                medical_history: document.getElementById('medical-history').value.trim()
            };

            try {
                const res = await fetch('/api/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to register');

                showToast(`Patient ${data.patient.full_name} registered as ${data.patient.patient_id}`, 'success');

                // Reset form and redirect to patients list after delay
                document.getElementById('patient-form').reset();
                setTimeout(() => {
                    window.location.href = 'patients.html';
                }, 2000);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">person_add</span> <span>Register Patient</span>';
            }
        });

        function doLogout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/'; })
                .catch(() => { window.location.href = '/'; });
        }
    </script>
</body>
</html>
